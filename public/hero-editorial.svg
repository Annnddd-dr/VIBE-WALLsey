    <path d="M 534 776 C 546 784 562 784 574 778" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>

    <!-- FRONT LEG — supporting, long and straight with a soft knee -->
    <path d="M 450 574 C 446 626 446 678 452 724 C 455 754 458 778 461 796 L 493 794 C 491 762 491 720 493 678 C 495 642 497 608 499 584 Z"
          fill="#8FCAF2" stroke="#1F2937" stroke-width="2.2"/>
    <path d="M 454 776 L 492 774" fill="none" stroke="#1F2937" stroke-width="1.7" opacity="0.65"/>
    <!-- front shoe -->
    <path d="M 492 792 C 498 798 500 810 496 818 C 488 828 468 832 454 828 C 442 824 440 812 448 802 C 456 793 470 790 480 792 Z"
          fill="#16181D" stroke="#1F2937" stroke-width="2"/>
    <path d="M 448 820 C 462 828 482 826 496 816" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>

    <!-- TORSO — narrow shoulders, slim, oversized yellow tee -->
    <path d="M 458 404
             C 446 408 440 418 440 430
             C 440 442 446 452 456 456
             C 450 490 448 526 454 558
             C 457 576 464 590 474 596
             C 496 604 520 602 540 594
             C 548 584 554 568 556 548
             C 560 514 558 480 550 454
             C 560 448 566 438 564 426
             C 562 414 554 406 544 402
             C 514 394 484 396 458 404 Z"
          fill="#F2C230" stroke="#1F2937" stroke-width="2.2"/>
    <!-- sleeve hems + collar -->
