    C 906 380 902 520 872 622
    C 838 740 756 836 632 886
    C 512 934 372 936 260 878
    C 152 822 84 714 74 588
    C 64 462 96 330 178 232
    C 262 132 368 112 502 96 Z"/>

  <!-- ============ DECORATIVE MARKS ============ -->
  <g stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M 138 328 l 14 14 M 152 328 l -14 14"/>
    <path d="M 856 268 l 12 12 M 868 268 l -12 12"/>
    <path d="M 122 680 l 12 12 M 134 680 l -12 12"/>
    <path d="M 560 92 l 11 11 M 571 92 l -11 11"/>
    <path d="M 884 546 l 10 10 M 894 546 l -10 10"/>
    <path d="M 792 470 l 34 8" stroke-width="2"/>
    <path d="M 788 494 l 28 10" stroke-width="2"/>
    <path d="M 176 452 l 26 -6" stroke-width="2"/>
    <path d="M 172 474 l 20 -8" stroke-width="2"/>
  </g>
  <g fill="#1F2937">
    <circle cx="212" cy="212" r="3.4"/>
    <circle cx="836" cy="132" r="3"/>
    <circle cx="90" cy="470" r="3"/>
    <circle cx="646" cy="918" r="3.2"/>
    <circle cx="322" cy="72" r="2.6"/>
  </g>
  <g fill="none" stroke="#1F2937" stroke-width="1.6">
    <circle cx="272" cy="140" r="7"/>
    <circle cx="812" cy="826" r="6"/>
