  <!-- ============ FLOATING POSTERS ============ -->

  <!-- P1: GOOD IDEAS TAKE TIME — upper right -->
  <g transform="translate(712 216) rotate(7)">
    <rect x="-84" y="-110" width="168" height="220" rx="3" fill="#101014" stroke="#1F2937" stroke-width="2"/>
    <text x="0" y="-58" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="26" letter-spacing="1">GOOD</text>
    <text x="0" y="-24" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="26" letter-spacing="1">IDEAS</text>
    <text x="0" y="10" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="26" letter-spacing="1">TAKE</text>
    <text x="0" y="44" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="26" letter-spacing="1">TIME</text>
    <path d="M -30 66 Q 0 56 30 66" fill="none" stroke="#F2C230" stroke-width="4" stroke-linecap="round"/>
    <circle cx="52" cy="82" r="9" fill="none" stroke="#F2C230" stroke-width="1.8"/>
    <circle cx="49" cy="79" r="1.2" fill="#F2C230"/>
    <circle cx="55" cy="79" r="1.2" fill="#F2C230"/>
    <path d="M 48.5 85 Q 52 88 55.5 85" fill="none" stroke="#F2C230" stroke-width="1.4" stroke-linecap="round"/>
  </g>

