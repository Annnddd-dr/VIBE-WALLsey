    <text x="-62" y="-70" fill="#17171A" font-family="Georgia, serif" font-weight="700" font-size="15">A</text>
    <text x="-62" y="-50" fill="#17171A" font-family="Georgia, serif" font-weight="700" font-size="15">BRIGHTER</text>
    <text x="-62" y="-30" fill="#17171A" font-family="Georgia, serif" font-weight="700" font-size="15">YOU</text>
    <path d="M 16 74 C 24 34 30 0 46 -52" fill="none" stroke="#2E5D3A" stroke-width="2.4"/>
    <path d="M 30 -4 C 40 -14 54 -14 62 -6 C 52 4 38 6 30 -4 Z" fill="#3E7C4F"/>
    <path d="M 34 -28 C 44 -40 58 -40 66 -30 C 56 -20 42 -18 34 -28 Z" fill="#57875F"/>
    <path d="M 42 -50 C 50 -62 64 -62 72 -52 C 62 -42 50 -42 42 -50 Z" fill="#6FA07A"/>
    <path d="M 8 22 C 0 14 -2 4 4 -2 C 12 4 14 14 8 22 Z" fill="#57875F"/>
  </g>

