  <g transform="translate(178 470) rotate(-5)">
    <rect x="-84" y="-100" width="168" height="200" rx="3" fill="#F6EFDE" stroke="#1F2937" stroke-width="2"/>
    <text x="0" y="-40" text-anchor="middle" fill="#17171A" font-family="Georgia, serif" font-weight="700" font-size="23" letter-spacing="1">CREATE</text>
    <text x="0" y="-8" text-anchor="middle" fill="#17171A" font-family="Georgia, serif" font-weight="700" font-size="23" letter-spacing="1">EXPLORE</text>
    <text x="0" y="24" text-anchor="middle" fill="#17171A" font-family="Georgia, serif" font-weight="700" font-size="23" letter-spacing="1">REPEAT</text>
