    <path d="M 563 444 C 557 450 549 454 541 456" fill="none" stroke="#1F2937" stroke-width="1.8" opacity="0.85"/>
    <path d="M 480 402 Q 500 414 522 400" fill="none" stroke="#1F2937" stroke-width="1.8" opacity="0.85"/>
    <!-- subtle folds -->
    <path d="M 480 486 C 484 512 484 538 480 560 M 522 484 C 518 510 518 536 522 558"
          fill="none" stroke="#D9A413" stroke-width="2.4" opacity="0.5"/>

    <!-- LEFT HAND — relaxed fingers -->
    <path d="M 570 556 C 566 568 568 580 576 586 C 584 590 592 586 594 578 C 596 568 592 558 586 552 Z"
          fill="#FDFCF8" stroke="#1F2937" stroke-width="2"/>
    <path d="M 576 586 C 578 590 582 592 586 591 M 582 584 C 585 587 588 588 591 586"
          fill="none" stroke="#1F2937" stroke-width="1.4"/>

    <!-- NECK — drawn over the collar, sides fade at the neckline -->
    <path d="M 480 316 L 482 412 L 520 410 L 518 314 Z" fill="#FDFCF8" stroke="none"/>
    <path d="M 480 316 L 482 404 M 518 314 L 520 402" fill="none" stroke="#1F2937" stroke-width="2"/>

    <!-- HEAD — slightly oversized, chin overlapping the collar -->
    <ellipse cx="500" cy="330" rx="49" ry="55" fill="#FDFCF8" stroke="#1F2937" stroke-width="2.2"/>
    <circle cx="542" cy="338" r="8" fill="#FDFCF8" stroke="#1F2937" stroke-width="1.8"/>
    <path d="M 540 334 Q 543 338 540 342" fill="none" stroke="#1F2937" stroke-width="1.3"/>

    <!-- HAIR — solid black, side-swept with a windswept flick -->
    <path d="M 452 340
             C 442 290 472 250 518 254
             C 558 258 578 288 574 324
             C 568 304 554 290 538 286
             C 546 300 548 314 544 326
             C 530 304 508 294 486 298
             C 464 302 454 318 452 340 Z"
          fill="#16181D"/>

    <!-- FACE — minimal -->
    <circle cx="478" cy="346" r="14.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2"/>
    <circle cx="513" cy="344" r="14.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2"/>
    <line x1="492.5" y1="345" x2="498.5" y2="344.5" stroke="#1F2937" stroke-width="2"/>
    <line x1="527.5" y1="342.5" x2="537" y2="340" stroke="#1F2937" stroke-width="1.8"/>
    <circle cx="479" cy="346" r="2.5" fill="#16181D"/>
    <circle cx="512" cy="344" r="2.5" fill="#16181D"/>
    <path d="M 468 328 Q 477 324 486 327" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M 503 326 Q 511 323 519 325" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
    <path d="M 494 356 Q 497 364 493 368" fill="none" stroke="#1F2937" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 488 376 Q 496 380 504 375" fill="none" stroke="#1F2937" stroke-width="1.8" stroke-linecap="round"/>

    <!-- RIGHT HAND — gripping the poster's lower corner (drawn last, over the poster) -->
    <path d="M 372 312
             C 364 318 360 328 362 338
             C 364 348 372 354 382 354
             C 390 354 396 348 398 340
             L 398 322 C 394 314 384 310 372 312 Z"
          fill="#FDFCF8" stroke="#1F2937" stroke-width="2"/>
    <path d="M 376 312 C 386 308 396 310 402 316" fill="none" stroke="#1F2937" stroke-width="1.8"/>
    <path d="M 374 322 C 384 318 394 319 402 322" fill="none" stroke="#1F2937" stroke-width="1.6"/>
    <path d="M 374 332 C 382 330 390 330 398 331" fill="none" stroke="#1F2937" stroke-width="1.6"/>
    <path d="M 368 320 C 364 314 366 308 372 306" fill="none" stroke="#1F2937" stroke-width="1.6"/>
  </g>
</svg>
