    <text x="-56" y="-66" fill="#17171A" font-family="Georgia, serif" font-weight="700" font-size="14" letter-spacing="1">MUSIC</text>
    <text x="-56" y="-48" fill="#17171A" font-family="Georgia, serif" font-weight="700" font-size="14" letter-spacing="1">HEALS</text>
    <circle cx="18" cy="22" r="46" fill="#15151A"/>
    <circle cx="18" cy="22" r="38" fill="none" stroke="#2E2E36" stroke-width="1"/>
    <circle cx="18" cy="22" r="30" fill="none" stroke="#2E2E36" stroke-width="1"/>
    <circle cx="18" cy="22" r="15" fill="#E8663C"/>
    <circle cx="18" cy="22" r="2.4" fill="#15151A"/>
    <g stroke="#9A917E" stroke-width="1.4">
