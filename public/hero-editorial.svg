<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Character dancing among floating posters">
  <defs>
    <linearGradient id="sunsetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B5CA5"/>
      <stop offset="55%" stop-color="#E98A5B"/>
      <stop offset="100%" stop-color="#F7C873"/>
