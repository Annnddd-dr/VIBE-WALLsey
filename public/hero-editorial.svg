    <path d="M -13 -25 Q -7 -32 0 -30 M 2 -30 Q 9 -30 12 -23 M -16 -17 Q -14 -24 -9 -28" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-21" y="-16" width="42" height="9" fill="#F2C230" stroke="#1F2937" stroke-width="1.4"/>
    <text x="0" y="74" text-anchor="middle" fill="#17171A" font-family="Georgia, serif" font-weight="700" font-size="9" letter-spacing="1">ART LIVES FOREVER</text>
  </g>

  <!-- P6: GOOD VIBES ONLY — bottom right (clear of the feet) -->
  <g transform="translate(668 878) rotate(-4)">
    <rect x="-78" y="-92" width="156" height="184" rx="3" fill="#F7C873" stroke="#1F2937" stroke-width="2"/>
    <rect x="-66" y="-80" width="132" height="126" fill="#E98A5B"/>
    <circle cx="4" cy="-26" r="14" fill="#FFE7B0"/>
    <rect x="-66" y="24" width="132" height="22" fill="#33517E"/>
    <path d="M -44 46 C -46 18 -40 -2 -32 -18 M -32 -18 C -46 -26 -58 -24 -64 -16 M -32 -18 C -26 -32 -14 -36 -4 -34 M -32 -18 C -40 -14 -46 -8 -48 0" fill="none" stroke="#22301F" stroke-width="3" stroke-linecap="round"/>
    <path d="M 46 46 C 46 28 44 14 40 4 M 40 4 C 32 -2 24 -2 18 2 M 40 4 C 44 -4 50 -8 56 -6" fill="none" stroke="#22301F" stroke-width="2.6" stroke-linecap="round"/>
    <text x="22" y="-58" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-style="italic" font-weight="600" font-size="17">Good</text>
    <text x="22" y="-38" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-style="italic" font-weight="600" font-size="17">Vibes</text>
    <text x="22" y="-18" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-style="italic" font-weight="600" font-size="17">Only</text>
  </g>

  <!-- ============ HELD POSTER — CHASE BETTER DAYS ============ -->
  <g transform="translate(300 235) rotate(-7)">
